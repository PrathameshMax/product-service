name: cd

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'product-service' }}
  ECS_CLUSTER: product-service-dev
  ECS_SERVICE: product-service
  TASK_FAMILY: product-service
  CONTAINER_NAME: product-service
  API_URL: https://api.dev.nexacommerce.in

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn -B -ntp verify

  publish:
    name: Build and push to ECR
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-publish-${{ github.run_id }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        name: Image coordinates
        run: |
          TAG="${GITHUB_SHA::12}"
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${TAG} already in ECR (immutable tags), skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.exists == 'false'

      - name: Build and push
        if: steps.meta.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ECR scan findings
        run: |
          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id imageTag="${{ steps.meta.outputs.tag }}" || true
          {
            echo "### ECR basic scan for \`${{ steps.meta.outputs.tag }}\`"
            echo '```json'
            aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
              --image-id imageTag="${{ steps.meta.outputs.tag }}" \
              --query 'imageScanFindings.findingSeverityCounts' --output json || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ECS (if lab is up)
    needs: publish
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 25
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - id: lab
        name: Is the lab stack running?
        run: |
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].status' --output text 2>/dev/null || echo "NONE")
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "Lab is down (service status: ${STATUS}). Image is in ECR; run the lab-up workflow to deploy it." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download current task definition
        if: steps.lab.outputs.status == 'ACTIVE'
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition --output json > task-definition.json

      - id: render
        if: steps.lab.outputs.status == 'ACTIVE'
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.publish.outputs.image }}
          environment-variables: |
            APP_VERSION=${{ needs.publish.outputs.tag }}

      - name: Deploy (rolling, circuit breaker auto-rollback)
        if: steps.lab.outputs.status == 'ACTIVE'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Smoke test
        if: steps.lab.outputs.status == 'ACTIVE'
        run: |
          EXPECTED="${{ needs.publish.outputs.tag }}"
          for i in $(seq 1 30); do
            VERSION=$(curl -fsS "$API_URL/api/v1/info" | jq -r .version || true)
            if [ "$VERSION" = "$EXPECTED" ]; then
              echo "Serving ${VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"
              curl -fsS "$API_URL/api/v1/products" | jq .
              exit 0
            fi
            echo "attempt ${i}: serving '${VERSION}', waiting for '${EXPECTED}'"
            sleep 10
          done
          echo "New version not served after 5 minutes"
          exit 1
